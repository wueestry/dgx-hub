[project]
name = "dgx-hub"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ryan Wüest", email = "wueestry@protonmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "rich>=13.7",
    "typer>=0.12",
    "pydantic>=2.7",
    "httpx>=0.27",
    "questionary>=2.0",
    "tomlkit>=0.13",
    "platformdirs>=4.2",
    "ruamel-yaml>=0.18",
]

[project.optional-dependencies]
scaffold = [
    "simpleeval>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-mock>=3.14",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
dgx-hub = "dgx_hub.cli:app"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "RUF"]
ignore = [
    "B008",   # typer.Argument()/typer.Option() as parameter defaults is the required idiom
]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
