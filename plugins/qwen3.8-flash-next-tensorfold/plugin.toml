[plugin]
name = "qwen3.8-flash-next-tensorfold"
display_name = "Qwen3.8-Flash-Next (TensorFold, single DGX Spark)"
description = "TensorFold v0.6.1 with the Vontra MLX 4-bit MTP checkpoint, SSD-offloaded PLE tables, int8 KV cache, and image/video input on one DGX Spark"
docs_url = "https://github.com/MiaAI-Lab/Qwen3.8-Flash-Next-Single-DGX-Spark-TensorFold"
schema_version = 1

[source]
repo_url = "https://github.com/MiaAI-Lab/Qwen3.8-Flash-Next-Single-DGX-Spark-TensorFold.git"

# start.sh prepares the patched image, downloads weights, and checks live memory.
# Keep setup there so --set overrides also govern preparation (provision has no env).

[[patch]]
description = "Publish on loopback and join the gateway network, including under rootless Docker"
file = "start.sh"
find = '  --gpus all --ipc=host --network host '
replace = '  --gpus all --ipc=host --network dgx-hub-net -p "127.0.0.1:$PORT:$PORT" '

# Dynamic image selection, cache paths, and setup checks require the upstream launcher.
[docker]
mode = "docker-run"
image = "tensorfold-qwen38:v0.6.1"
container_name = "qwen38-flash-next-tf"
network_mode = "bridge"
gpus = "all"
ipc = "host"
# start.sh mounts resolved HF_CACHE and KERNEL_CACHE paths itself.
volumes = []
env_passthrough = ["HF_TOKEN"]
ports = [{ container_port = 8888, publish_strategy = "loopback-remap", port_override_env_var = "PORT" }]
command_args = []

[[variant]]
id = "default"
label = "MLX 4-bit MTP, 5 streams × 262144 tokens, int8 KV, vision enabled"
default = true

[health]
url = "http://{backend_address}/v1/models"
interval_seconds = 10
timeout_seconds = 5
startup_grace_seconds = 120
expected_first_boot_seconds = 1800

[resources]
# Upstream checks cache and image filesystems separately (~125 GB + ~35 GB).
min_free_disk_gib = 160
min_free_memory_gib = 103
gpu_required = true
exclusive_gpu = true

[env.SERVED_NAME]
type = "string"
default = "Qwen3.8-Flash-Next"
description = "Model id clients send as model; also reported by /v1/models"

[env.PARALLEL]
type = "integer"
default = 5
description = "Concurrent decode streams; each needs its own context cache. Lower to 4 for more memory headroom"

[env.CONTEXT]
type = "integer"
default = 262144
description = "Prompt plus reply window per stream; native maximum 262144 tokens"

[env.KV_DTYPE]
type = "enum"
choices = ["bf16", "int8", "int4"]
default = "int8"
description = "KV cache precision. int4 saves memory but may change output; bf16 needs fewer streams"

[env.PLE_ON_SSD]
type = "enum"
choices = ["0", "1"]
default = "1"
description = "Read n-gram tables from SSD instead of keeping them in RAM; disabling uses substantially more memory"

[env.VISION]
type = "enum"
choices = ["0", "1"]
default = "1"
description = "Enable image and video input; 0 serves text only"

[env.VISION_URLS]
type = "enum"
choices = ["0", "1"]
default = "0"
description = "Accept public HTTPS image/video URLs in addition to data URLs"

[env.VISION_MAX_IMAGES]
type = "integer"
default = 50
description = "Maximum images per request, counting all chat turns"

[env.DRAFT_LANGUAGE]
type = "string"
default = ""
description = "Optional language draft image: zh or ja recommended; also accepts de, fr, pt, ru and comma-separated combinations such as zh,ja. Empty uses the English/code image"

[env.MTP_DRAFTS]
type = "integer"
default = 6
description = "Maximum MTP drafts per round"

[env.MTP_CONFIDENCE]
type = "string"
default = "0.60"
description = "Confidence threshold for continuing an MTP draft chain"

[env.TEMPERATURE]
type = "string"
default = "1.0"
description = "Default sampling temperature; requests can override it"

[env.TOP_P]
type = "string"
default = "0.95"
description = "Default nucleus sampling probability; requests can override it"

[env.TOP_K]
type = "integer"
default = 20
description = "Default top-k sampling; requests can override it"

[env.THINKING]
type = "enum"
choices = ["0", "1"]
default = "1"
description = "Enable thinking by default; requests can override it with chat_template_kwargs"

[env.MAX_TOKENS]
type = "integer"
default = 32768
description = "Reply limit when a request omits max_tokens, clamped to the stream window"

[env.TENSORFOLD_PREFILL_ROWS]
type = "integer"
default = 2048
description = "Prompt chunk rows (256-16384); upstream recommends 2048 with SSD PLE tables"

[env.TENSORFOLD_MEMORY_RESERVE_GIB]
type = "integer"
default = 2
description = "Memory excluded from startup admission, minimum 2 GiB. Raise for host headroom; the server may require fewer streams or a shorter context"

[env.TENSORFOLD_MTP_COPY]
type = "enum"
choices = ["0", "1"]
default = "1"
description = "Prompt-lookup drafts for repeated prompt text, effective with at least two streams"

[env.TENSORFOLD_IMAGE_TOKENS]
type = "integer"
default = 16384
description = "Shared token budget for all images in a request"

[env.TENSORFOLD_VIDEO_TOKENS]
type = "integer"
default = 16384
description = "Video token budget per request"

[env.PREPARE]
type = "enum"
choices = ["auto", "0", "1"]
default = "auto"
description = "auto prepares image/checkpoint when needed; 1 always prepares; 0 skips setup"

[env.PULL]
type = "enum"
choices = ["0", "1"]
default = "1"
description = "Try the matching prebuilt image first; 0 builds locally"

[env.WAIT_TIMEOUT]
type = "integer"
default = 1800
description = "Upstream launcher readiness timeout in seconds, after setup finishes"

[env.EXTRA_ARGS]
type = "string"
default = ""
description = "Extra tensorfold serve flags, parsed with shell quoting and appended after defaults. Keep host and port managed by DGX Hub"

[[env.validation]]
rule = "PARALLEL >= 1 and 1 <= CONTEXT <= 262144 and MAX_TOKENS >= 1"
message = "PARALLEL and MAX_TOKENS must be positive; CONTEXT must be between 1 and 262144"

[[env.validation]]
rule = "TENSORFOLD_MEMORY_RESERVE_GIB >= 2 and 256 <= TENSORFOLD_PREFILL_ROWS <= 16384"
message = "Memory reserve must be at least 2 GiB; prefill rows must be between 256 and 16384"

[[env.validation]]
rule = "VISION_MAX_IMAGES >= 1 and TENSORFOLD_IMAGE_TOKENS >= 1 and TENSORFOLD_VIDEO_TOKENS >= 1 and WAIT_TIMEOUT >= 1"
message = "Vision limits and WAIT_TIMEOUT must be positive"

[fallback]
enabled = true
# Fix runtime identity and container bind independently of user .env settings.
# Python's shlex preserves quoted EXTRA_ARGS without invoking shell evaluation.
start_command = ["python3", "-c", "import os, shlex; os.environ.update(CONTAINER_NAME='qwen38-flash-next-tf', HOST='0.0.0.0', FOREGROUND='0'); os.execv('./start.sh', ['./start.sh', *shlex.split(os.environ.get('EXTRA_ARGS', ''))])"]
stop_command = ["env", "CONTAINER_NAME=qwen38-flash-next-tf", "HOST=0.0.0.0", "./stop.sh"]
