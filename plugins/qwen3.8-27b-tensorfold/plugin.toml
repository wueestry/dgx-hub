[plugin]
name = "qwen3.8-27b-tensorfold"
display_name = "Qwen3.8-27B (TensorFold, single DGX Spark)"
description = "TensorFold v0.6.0 with the Vontra MLX 4-bit checkpoint, DFlash2 drafting, FP8 KV/prefill, a pinned cache pool, image/video input, and optional YaRN"
docs_url = "https://github.com/MiaAI-Lab/Qwen3.8-27B-DGX-Spark-TensorFold"
schema_version = 1

[source]
repo_url = "https://github.com/MiaAI-Lab/Qwen3.8-27B-DGX-Spark-TensorFold.git"

# start.sh prepares the patched image and both checkpoints using resolved --set values.
[[patch]]
description = "Publish on loopback and join the gateway network, including under rootless Docker"
file = "start.sh"
find = '  --gpus all --ipc=host --network host '
replace = '  --gpus all --ipc=host --network dgx-hub-net -p "127.0.0.1:$PORT:$PORT" '

[[patch]]
description = "Honor an explicitly empty DRAFT_ID to disable drafting and drafter download"
file = "scripts/config.sh"
find = 'DRAFT_ID="${DRAFT_ID:-z-lab/Qwen3.8-27B-DFlash2}"'
replace = 'DRAFT_ID="${DRAFT_ID-z-lab/Qwen3.8-27B-DFlash2}"'

# Dynamic cache-pool sizing, image setup, and cache paths require the upstream launcher.
[docker]
mode = "docker-run"
image = "tensorfold-qwen38-27b:v0.6.0"
container_name = "qwen38-27b-tf"
network_mode = "bridge"
gpus = "all"
ipc = "host"
# start.sh mounts resolved HF_CACHE and KERNEL_CACHE paths itself.
volumes = []
env_passthrough = ["HF_TOKEN"]
ports = [{ container_port = 8888, publish_strategy = "loopback-remap", port_override_env_var = "PORT" }]
command_args = []

[[variant]]
id = "default"
label = "MLX 4-bit + DFlash2, 8 streams, FP8 KV/prefill, auto cache pool, vision"
default = true

[health]
url = "http://{backend_address}/v1/models"
interval_seconds = 5
timeout_seconds = 5
startup_grace_seconds = 60
expected_first_boot_seconds = 1800

[resources]
# Upstream checks checkpoint/image space separately; auto KV pool adapts to free RAM.
min_free_disk_gib = 60
min_free_memory_gib = 60
gpu_required = true
exclusive_gpu = true

[env.SERVED_NAME]
type = "string"
default = "Qwen3.8-27B"
description = "Model id clients send as model; also reported by /v1/models"

[env.MODEL_ID]
type = "string"
default = "Vontra/Qwen3.8-27B-MLX-4bit"
description = "Target checkpoint. nvidia/Qwen3.8-27B-NVFP4 requires VISION=0"

[env.DRAFT_ID]
type = "string"
default = "z-lab/Qwen3.8-27B-DFlash2"
description = "DFlash2 checkpoint to prepare; empty disables drafts and skips its download"

[env.PARALLEL]
type = "integer"
default = 8
description = "Concurrent decode streams sharing the pinned KV pool; higher values leave less memory for that pool"

[env.CONTEXT]
type = "integer"
default = 0
description = "Prompt plus reply window per stream. 0 lets upstream choose 262144 × YARN_FACTOR (or read CONTEXT from .env); a positive value sets the window explicitly"

[env.YARN_FACTOR]
type = "integer"
default = 1
description = "RoPE scaling factor: 1 keeps native context; 4 enables a 1048576-token window when CONTEXT=0. Larger windows need more cache and prefill time"

[env.KV_POOL_GB]
type = "string"
default = "auto"
description = "Pinned cache pool in GiB: auto sizes it from free memory up to 78, a number fixes it, 0 disables pinning. YaRN and extra streams reduce the automatic pool"

[env.KV_DTYPE]
type = "enum"
choices = ["fp8", "bf16"]
default = "fp8"
description = "Attention cache precision; FP8 uses half the KV memory of BF16"

[env.PREFILL_FP8]
type = "enum"
choices = ["0", "1"]
default = "1"
description = "FP8 prompt activations for faster prefill; 0 uses BF16 prompt activations"

[env.VISION]
type = "enum"
choices = ["0", "1"]
default = "1"
description = "Enable image/video input; requires the MLX checkpoint"

[env.VISION_URLS]
type = "enum"
choices = ["0", "1"]
default = "0"
description = "Accept public HTTPS image/video URLs in addition to data URLs"

[env.TENSORFOLD_MAX_IMAGES]
type = "integer"
default = 50
description = "Maximum images per request, counting all chat turns"

[env.TENSORFOLD_IMAGE_TOKENS]
type = "integer"
default = 16384
description = "Shared token budget for all images in a request"

[env.TENSORFOLD_VIDEO_TOKENS]
type = "integer"
default = 16384
description = "Video token budget per request"

[env.TENSORFOLD_MEMORY_RESERVE_GIB]
type = "integer"
default = 0
description = "Memory excluded from admission. Upstream defaults to 0; raise for more host headroom and reduce KV_POOL_GB if admission refuses the configuration"

[env.CHECKPOINT_SLOTS]
type = "string"
default = ""
description = "Retained prompt-end states for prefix reuse; empty keeps TensorFold's default"

[env.TEMPERATURE]
type = "string"
default = "1.0"
description = "Default sampling temperature; requests can override it"

[env.TOP_P]
type = "string"
default = "0.95"
description = "Default nucleus sampling probability; requests can override it"

[env.TOP_K]
type = "integer"
default = 20
description = "Default top-k sampling; requests can override it"

[env.THINKING]
type = "enum"
choices = ["0", "1"]
default = "1"
description = "Enable thinking by default; requests can override it with chat_template_kwargs"

[env.PREPARE]
type = "enum"
choices = ["auto", "0", "1"]
default = "auto"
description = "auto prepares image/checkpoints when needed; 1 always prepares; 0 skips setup"

[env.PULL]
type = "enum"
choices = ["0", "1"]
default = "1"
description = "Try the matching prebuilt image first; 0 builds locally"

[env.WAIT_TIMEOUT]
type = "integer"
default = 1800
description = "Upstream launcher readiness timeout in seconds, after setup finishes"

[env.EXTRA_ARGS]
type = "string"
default = ""
description = "Extra tensorfold serve flags, parsed with shell quoting and appended after defaults. Keep host and port managed by DGX Hub"

[[env.validation]]
rule = "PARALLEL >= 1 and CONTEXT >= 0 and YARN_FACTOR >= 1"
message = "PARALLEL and YARN_FACTOR must be positive; CONTEXT must be 0 (automatic) or positive"

[[env.validation]]
rule = "TENSORFOLD_MEMORY_RESERVE_GIB >= 0 and WAIT_TIMEOUT >= 1"
message = "Memory reserve cannot be negative; WAIT_TIMEOUT must be positive"

[[env.validation]]
rule = "TENSORFOLD_MAX_IMAGES >= 1 and TENSORFOLD_IMAGE_TOKENS >= 1 and TENSORFOLD_VIDEO_TOKENS >= 1"
message = "Vision limits must be positive"

[[env.validation]]
rule = "not (MODEL_ID == 'nvidia/Qwen3.8-27B-NVFP4' and VISION == '1')"
message = "The NVIDIA NVFP4 checkpoint requires VISION=0"

[fallback]
enabled = true
# CONTEXT=0 unsets the override so upstream can derive its window from YARN_FACTOR.
start_command = ["python3", "-c", "import os, shlex; os.environ.update(CONTAINER_NAME='qwen38-27b-tf', HOST='0.0.0.0', FOREGROUND='0'); os.environ.pop('CONTEXT', None) if os.environ.get('CONTEXT') == '0' else None; os.execv('./start.sh', ['./start.sh', *shlex.split(os.environ.get('EXTRA_ARGS', ''))])"]
stop_command = ["env", "CONTAINER_NAME=qwen38-27b-tf", "HOST=0.0.0.0", "./stop.sh"]
