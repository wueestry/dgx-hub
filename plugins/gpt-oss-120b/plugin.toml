[plugin]
name = "gpt-oss-120b"
display_name = "GPT-OSS-120B (vLLM, MXFP4)"
description = "vLLM server for OpenAI's gpt-oss-120b (117B total / 5.1B active MoE, native MXFP4 MoE weights), NVIDIA's DGX-Spark-optimized-models blog names this as running full precision on a single system"
docs_url = "https://huggingface.co/openai/gpt-oss-120b"
schema_version = 1

# UNVERIFIED DRAFT -- unlike this repo's other plugins, nobody here has run
# this on real DGX Spark hardware yet. Flags below combine (a) OpenAI's own
# minimal reference command ("vllm serve openai/gpt-oss-120b", no extra
# flags -- https://developers.openai.com/cookbook/articles/gpt-oss/run-vllm)
# and (b) community-reported SM121 (GB10/Blackwell)-specific fixes that
# aren't optional there, per a DGX Spark forum/troubleshooting thread:
#   - MXFP4 MUST use the marlin backend on SM121; the CUTLASS FP4 path
#     reportedly corrupts the first Harmony token (content: null on first
#     response, broken output after).
#   - Attention backend MUST be triton, not flashinfer; gpt-oss uses
#     attention sinks and FlashInfer's SM121 path doesn't implement them
#     (hard startup crash, not a silent fallback).
#   - Tool calls use OpenAI's Harmony format: --tool-call-parser openai
#     (not qwen3_coder/hermes, which the other plugins in this repo use).
# Treat all of this the way this repo treats any unverified source: confirm
# against the container's actual `vllm serve --help` and a real boot before
# trusting it, then delete this comment block once confirmed on hardware.

[source]
repo_url = "https://huggingface.co/openai/gpt-oss-120b"

# No [provision] section: `vllm serve` auto-downloads the checkpoint into
# the named HF cache volume below on first container start.
# No [[patch]] entries and no [fallback]: fully expressible via [docker]
# below, same shape as this repo's other vllm-based plugins.

[docker]
mode = "docker-run"
# Same image NVIDIA's own Qwen3.6-35B-A3B model card publishes for its
# DGX-Spark-optimized recipe (see qwen3.6-35b-a3b/plugin.toml) -- picked
# here on the assumption that a floating `nightly` tag is the most likely
# to carry both aarch64/GB10 support and the gpt-oss MXFP4/marlin fixes
# above. nemotron-3-nano-4b's plugin notes the *pinned* Docker Hub
# `vllm/vllm-openai` tags are x86_64-only; if `nightly` turns out not to be
# multi-arch either, fall back to an NGC image (e.g.
# nvcr.io/nvidia/vllm:26.02-py3, as nemotron-3-nano-4b uses) instead.
image = "vllm/vllm-openai:nightly"
container_name = "gpt-oss-120b"
network_mode = "bridge"
gpus = "all"
ipc = "host"
volumes = ["dgx-hub-gpt-oss-120b-hf-cache:/root/.cache/huggingface"]
env_passthrough = ["HF_TOKEN"]
ports = [{ container_port = 8888, publish_strategy = "loopback-remap" }]
# vllm/vllm-openai's image already sets ENTRYPOINT ["vllm", "serve"] (see
# qwen3.6-35b-a3b's comment on the same image) -- command_args must NOT
# repeat "vllm", "serve".
command_args = [
  "openai/gpt-oss-120b",
  "--served-model-name", "gpt-oss-120b",
  "--host", "0.0.0.0",
  "--port", "8888",
  "--tensor-parallel-size", "1",
  "--quantization", "mxfp4",
  "--attention-backend", "TRITON_ATTN",
  "--gpu-memory-utilization", "0.85",
  "--max-model-len", "131072",
  "--max-num-seqs", "4",
  "--async-scheduling",
  "--enable-auto-tool-choice",
  "--tool-call-parser", "openai",
]

[health]
url = "http://{backend_address}/health"
interval_seconds = 5
timeout_seconds = 5
startup_grace_seconds = 120
expected_first_boot_seconds = 2400

[resources]
# ~65 GiB MXFP4 checkpoint (117B total params, MoE weights natively MXFP4)
# plus KV cache and image layers. Both numbers below are estimates pending
# a real boot on this hardware -- tighten once measured, the way every
# other plugin in this repo already has.
min_free_disk_gib = 90
min_free_memory_gib = 90
gpu_required = true

[env.CONTEXT_LENGTH]
type = "integer"
default = 131072
description = "Max context length (--max-model-len). 131072 is gpt-oss's native trained context"

[env.GPU_MEM]
type = "string"
default = "0.85"
description = "Fraction of the 128 GB unified pool for weights+KV (--gpu-memory-utilization). Unverified starting point -- lower it if boot OOMs, same pattern as qwen3.8-flash-next's GPU_MEM"

[env.MAX_CONCURRENT_REQUESTS]
type = "integer"
default = 4
description = "Max concurrent sequences (--max-num-seqs). Left conservative since weights alone are ~65 GiB of the 128 GB pool"

[env.EXTRA_ARGS]
type = "string"
default = ""
description = "Free-form escape hatch appended after the baked-in vllm serve flags (vLLM's argparse takes the last occurrence of a repeated flag, so this also overrides defaults above, e.g. '--gpu-memory-utilization 0.75')"
