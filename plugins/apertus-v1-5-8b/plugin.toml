[plugin]
name = "apertus-v1-5-8b"
display_name = "Apertus v1.5 8B (vLLM, Swiss AI fork)"
description = "vLLM server (Swiss AI's own fork/image) for Apertus v1.5 8B: a fully open (Apache 2.0) decoder-only transformer with xIELU activation, multimodal input (text/image/audio in, text out), tool calling via the 'apertus' parser, optional thinking mode, and up to 262144-token context"
docs_url = "https://huggingface.co/swiss-ai/Apertus-v1.5-8B"
schema_version = 1

[source]
repo_url = "https://huggingface.co/swiss-ai/Apertus-v1.5-8B"

# No [provision] section: `vllm serve` auto-downloads the checkpoint into the
# named HF cache volume below on first container start.
# No [[patch]] entries: fully declarable via [docker] below.

[docker]
mode = "docker-run"
# Swiss AI publish this image straight from their own vLLM/transformers forks
# (github.com/swiss-ai/model-launch, images/vllm_apertus_1.5_release) with an
# ARM64 tag specifically -- matches DGX Spark/GB10's aarch64 host, same
# reasoning as nemotron-3-nano-4b's NGC image choice. An AMD64 tag
# (`latest-amd64`) exists too for x86 hosts.
# The image's own Dockerfile sets no ENTRYPOINT/CMD, so -- unlike
# vllm/vllm-openai's published images -- command_args below must still spell
# out "vllm", "serve" itself (same shape as this repo's other generic-image
# vllm plugins: ornith1.5-35b-a3b, nemotron-3-nano-4b).
image = "ghcr.io/swiss-ai/vllm_apertus_1.5_release:latest-arm64"
container_name = "apertus-v1-5-8b"
network_mode = "bridge"
gpus = "all"
ipc = "host"
volumes = ["dgx-hub-apertus-hf-cache:/root/.cache/huggingface"]
env_passthrough = ["HF_TOKEN"]
ports = [{ container_port = 8000, publish_strategy = "loopback-remap" }]
# Swiss AI's own published vllm serve command for the 8B checkpoint, verbatim
# except --host/--port added for this repo's generic health-check wiring and
# --served-model-name for a stable client-facing model id.
# "Thinking mode" (enable_thinking=True) and tool calling are mutually
# exclusive per the model card, but both are per-request chat-template
# kwargs, not server launch flags -- nothing to configure here.
command_args = [
  "vllm", "serve", "swiss-ai/Apertus-v1.5-8B",
  "--served-model-name", "apertus-v1.5-8b",
  "--host", "0.0.0.0",
  "--port", "8000",
  "--chat-template-content-format", "string",
  "--gpu-memory-utilization", "0.6",
  "--max-model-len", "262144",
  "--enable-auto-tool-choice",
  "--tool-call-parser", "apertus",
]

[health]
url = "http://{backend_address}/health"
interval_seconds = 5
timeout_seconds = 5
startup_grace_seconds = 90
expected_first_boot_seconds = 1800

[resources]
# ~9B params (8B base + multimodal vision/audio encoder layers) in BF16, plus
# KV cache and image layers.
min_free_disk_gib = 35
min_free_memory_gib = 25
gpu_required = true

[env.EXTRA_ARGS]
type = "string"
default = ""
description = "Free-form escape hatch appended after the baked-in vllm serve flags (vLLM's argparse takes the last occurrence of a repeated flag, so this also overrides defaults above, e.g. '--gpu-memory-utilization 0.8 --max-model-len 65536')"
